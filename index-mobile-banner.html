<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02080c">
<title>Caiman Cash — Envía dinero a Cuba</title>
<style>
:root{
  --navy:#06131B;
  --mint:#59D6B5;
  --white:#F8FAFC;
  --muted:#CBD5E1;
  --soft:#94A3B8;
  --line:rgba(89,214,181,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{
  min-height:100vh;
  background:radial-gradient(circle at 50% 35%,rgba(89,214,181,.08),transparent 38%),#02080c;
  font-family:Inter,Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:12px;color:var(--white);
}
.banner{
  position:relative;width:min(100%,430px);height:580px;overflow:hidden;
  border-radius:27px;background:var(--navy);border:1px solid var(--line);
  box-shadow:0 28px 75px rgba(0,0,0,.62),inset 0 0 0 1px rgba(255,255,255,.025);
  isolation:isolate;
}
.banner-image{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center center;z-index:-3;transform:scale(1.01);
}
.overlay{
  position:absolute;inset:0;z-index:-2;
  background:
    linear-gradient(180deg,rgba(2,8,12,.15) 0%,rgba(2,8,12,.03) 25%,rgba(2,8,12,.10) 45%,rgba(2,8,12,.58) 68%,rgba(2,8,12,.97) 100%),
    linear-gradient(90deg,rgba(2,8,12,.25),transparent 70%);
}
.content{
  position:relative;width:100%;height:100%;
  padding:20px 19px 16px;display:flex;flex-direction:column;
}
.brand-row{display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:850;letter-spacing:-.045em}
.brand-dot{
  width:9px;height:9px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 17px rgba(89,214,181,.9);
}
.brand .cash{color:var(--mint)}
.powered{margin-top:4px;margin-left:17px;color:var(--mint);font-size:7px;font-weight:800;letter-spacing:.17em}
.secure-pill{
  padding:6px 9px;border-radius:999px;border:1px solid rgba(89,214,181,.2);
  background:rgba(4,18,25,.46);backdrop-filter:blur(8px);color:#b9cbd1;font-size:8px;font-weight:700;
}
.secure-pill span{color:var(--mint);margin-right:4px}
.hero{margin-top:18px;max-width:340px}
.eyebrow{
  display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;
  background:rgba(89,214,181,.08);border:1px solid rgba(89,214,181,.16);color:var(--mint);
  font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
h1{
  margin-top:9px;font-size:clamp(34px,9.5vw,44px);line-height:.94;
  letter-spacing:-.058em;font-weight:900;text-shadow:0 3px 25px rgba(0,0,0,.35);
}
h1 .highlight{color:var(--mint)}
.subtitle{
  margin-top:9px;color:var(--muted);font-size:13.5px;line-height:1.35;max-width:300px;
}
.subtitle strong{color:var(--white)}
.benefits{
  margin-top:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:385px;
}
.benefit{
  padding:8px 7px;border-radius:12px;border:1px solid rgba(89,214,181,.14);
  background:rgba(4,17,24,.55);backdrop-filter:blur(9px);
}
.icon{color:var(--mint);font-size:13px}
.title{margin-top:3px;font-size:10px;font-weight:850}
.text{margin-top:2px;color:var(--soft);font-size:7px;line-height:1.25}
.spacer{flex:1;min-height:10px}
.cta-area{
  padding:9px;border-radius:20px;
  background:linear-gradient(180deg,rgba(5,20,27,.45),rgba(5,20,27,.75));
  border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);
}
.cta{
  width:100%;min-height:50px;border:0;border-radius:15px;background:var(--mint);
  color:var(--navy);font:inherit;font-size:15px;font-weight:900;cursor:pointer;
  box-shadow:0 12px 32px rgba(89,214,181,.22);
  transition:transform .2s ease,box-shadow .2s ease;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(89,214,181,.30)}
.microcopy{
  margin-top:7px;text-align:center;color:#8ca1aa;font-size:9px;
}
.microcopy span{color:var(--mint)}
@media(max-width:380px){
  body{padding:8px}
  .banner{width:100%;height:550px;border-radius:23px}
  .content{padding:17px 15px 14px}
  .secure-pill{display:none}
  .hero{margin-top:16px}
  h1{font-size:34px}
  .subtitle{font-size:12.5px}
  .benefits{margin-top:11px}
  .benefit{padding:7px 6px}
  .title{font-size:9px}
  .text{font-size:6.5px}
  .cta-area{padding:8px}
  .cta{min-height:47px;font-size:14px}
  .microcopy{font-size:8px}
}
@media(min-width:700px){
  .banner{width:430px;height:580px}
}
</style>
</head>
<body>
<section class="banner" aria-label="Caiman Cash — Envía dinero a Cuba">
  <img class="banner-image" src="src/assets/cubalink-banner-mobile.png" alt="">
  <div class="overlay"></div>
  <div class="content">
    <div class="brand-row">
      <div>
        <div class="brand">
          <span class="brand-dot"></span>
          <span>Caiman<span class="cash">Cash</span></span>
        </div>
        <div class="powered">REMESAS A CUBA</div>
      </div>
      <div class="secure-pill"><span>●</span>Seguro</div>
    </div>
    <div class="hero">
      <div class="eyebrow">✦ ENVÍA DINERO A CUBA</div>
      <h1>Tu dinero.<br><span class="highlight">Directo a Cuba.</span></h1>
      <p class="subtitle">Envía remesas de forma <strong>rápida, sencilla y segura.</strong></p>
      <div class="benefits">
        <div class="benefit">
          <div class="icon">⚡</div>
          <div class="title">Rápido</div>
          <div class="text">Procesamiento ágil</div>
        </div>
        <div class="benefit">
          <div class="icon">◉</div>
          <div class="title">Seguro</div>
          <div class="text">Operación protegida</div>
        </div>
        <div class="benefit">
          <div class="icon">✓</div>
          <div class="title">Fácil</div>
          <div class="text">Sin complicaciones</div>
        </div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="cta-area">
      <button class="cta" type="button">Enviar dinero a Cuba →</button>
      <div class="microcopy"><span>●</span>Tu remesa, más cerca de casa</div>
    </div>
  </div>
</section>
</body>
</html>
